<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>痞老板画圈圈</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }
  #game { display: block; cursor: pointer; }
  #hud {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
    color: #fff; font-size: 15px; letter-spacing: 1px;
    text-shadow: 0 2px 6px rgba(0,0,0,.6);
    display: flex; gap: 18px; align-items: center;
    pointer-events: none;
  }
  #hud .progress { color: #9dff6e; font-weight: bold; font-size: 18px; }
  #overlay {
    position: fixed; inset: 0; display: flex;
    flex-direction: column; align-items: center; justify-content: center;
    background: rgba(10,10,25,.55); backdrop-filter: blur(3px);
    color: #fff; text-align: center; gap: 14px; z-index: 10;
  }
  #overlay.hidden { display: none; }
  #overlay h1 { font-size: 34px; color: #9dff6e; text-shadow: 0 3px 10px rgba(0,0,0,.7); }
  #overlay p { font-size: 15px; color: #cfd3ff; line-height: 1.9; }
  #overlay .btn {
    margin-top: 10px; padding: 12px 46px; font-size: 18px;
    background: linear-gradient(135deg, #67e84f, #2fae3e);
    color: #fff; border: none; border-radius: 999px; cursor: pointer;
    box-shadow: 0 6px 18px rgba(80,220,80,.35);
    transition: transform .12s;
  }
  #overlay .btn:hover { transform: scale(1.06); }
  .settings {
    display: flex; flex-direction: column; gap: 10px;
    background: rgba(255,255,255,.07);
    padding: 16px 22px; border-radius: 12px;
    margin-top: 6px;
  }
  .settings label {
    display: flex; justify-content: space-between; align-items: center;
    gap: 14px; font-size: 14px; color: #cfd3ff;
  }
  .settings input[type=number] {
    width: 70px; padding: 4px 8px; font-size: 14px;
    background: rgba(0,0,0,.35); color: #fff;
    border: 1px solid rgba(255,255,255,.2); border-radius: 6px;
    text-align: center;
  }
  .settings input[type=range] {
    width: 140px; accent-color: #67e84f;
  }
  .settings .val {
    display: inline-block; width: 40px; text-align: right; color: #9dff6e;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <span>进度 <span class="progress" id="progress">0%</span></span>
  <span>时间 <span class="progress" id="time">0秒</span></span>
  <span>最佳 <span class="progress" id="best">0%</span></span>
</div>
<div id="overlay">
  <h1 id="title">痞老板画圈圈</h1>
  <p id="desc">
    痞老板会沿圆环自动奔跑，跑过的地方会被涂上颜色。<br>
    圆环上有几只怪物在定速游走，碰到就会失败！<br>
    按 <b>空格</b> 或 <b>点击屏幕</b> 让痞老板跳起躲开怪物（跳过的地方不会被涂色）。<br>
    把整条圆环全部涂满就胜利！
  </p>
  <div class="settings">
    <label>怪物数量
      <span><input type="range" id="monsterCount" min="1" max="8" value="4"> <span class="val" id="monsterCountVal">4</span></span>
    </label>
    <label>怪物速度
      <span><input type="range" id="monsterSpeed" min="0.5" max="2" step="0.05" value="1"> <span class="val" id="monsterSpeedVal">1</span></span>
    </label>
    <label>痞老板速度
      <span><input type="range" id="runSpeed" min="0.5" max="2" step="0.05" value="1"> <span class="val" id="runSpeedVal">1</span></span>
    </label>
  </div>
  <button class="btn" id="startBtn">开始游戏</button>
</div>

<script>
(function () {
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var overlay = document.getElementById('overlay');
  var titleEl = document.getElementById('title');
  var descEl = document.getElementById('desc');
  var startBtn = document.getElementById('startBtn');
  var progressEl = document.getElementById('progress');
  var bestEl = document.getElementById('best');
  var timeEl = document.getElementById('time');

  var monsterCountInput = document.getElementById('monsterCount');
  var monsterSpeedInput = document.getElementById('monsterSpeed');
  var runSpeedInput = document.getElementById('runSpeed');
  var monsterCountVal = document.getElementById('monsterCountVal');
  var monsterSpeedVal = document.getElementById('monsterSpeedVal');
  var runSpeedVal = document.getElementById('runSpeedVal');

  monsterCountInput.addEventListener('input', function () { monsterCountVal.textContent = monsterCountInput.value; });
  monsterSpeedInput.addEventListener('input', function () { monsterSpeedVal.textContent = monsterSpeedInput.value; });
  runSpeedInput.addEventListener('input', function () { runSpeedVal.textContent = runSpeedInput.value; });

  var W, H, CX, CY, R;

  function resize() {
    var dpr = window.devicePixelRatio || 1;
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    CX = W / 2; CY = H / 2;
    R = Math.min(W, H) * 0.32;
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- 游戏配置 ----------
  var TAU = Math.PI * 2;
  var JUMP_TIME = 0.42;          // 跳跃滞空时长（秒）
  var HIT_DIST = 24;             // 碰撞判定像素距离（屏幕坐标）
  var RING_WIDTH = 14;           // 跑道宽度
  var PAINT_WIDTH = 18;          // 涂色宽度
  var DROP_TIME = 0.9;           // 开场从圆心落到跑道的时间（秒）

  // 运行时参数（开始前从设置读取）
  var RUN_SPEED;                 // 痞老板角速度 rad/s（正值=逆时针，后面会取负实现顺时针）
  var MONSTER_SPEED;             // 怪物角速度 rad/s（逆时针）
  var MONSTER_COUNT;             // 怪物数量

  // ---------- 状态 ----------
  var state = 'ready'; // ready | playing | dropping | dead | won
  var planktonAngle, jumpTimer, dropTimer, dropFromY, monsters;
  var painted;         // 已合并的涂色区间数组 [[a,b],...]  0<=a<b<=TAU
  var paintedTotal;    // 已涂总弧度
  var lastTime, deathFlash;
  var playTime;        // 本次游玩时间（秒，不含下落阶段）

  var best = 0;

  function init() {
    RUN_SPEED = -parseFloat(runSpeedInput.value);       // 顺时针
    MONSTER_SPEED = parseFloat(monsterSpeedInput.value); // 逆时针
    MONSTER_COUNT = parseInt(monsterCountInput.value);

    planktonAngle = Math.PI / 2;   // 圆环正下方
    jumpTimer = 0;
    dropTimer = DROP_TIME;
    dropFromY = CY * 0.6;          // 略高于圆心，视觉上像从屏幕中央落下
    painted = [];
    paintedTotal = 0;
    deathFlash = 0;
    playTime = 0;
    timeEl.textContent = '0秒';

    monsters = [];
    for (var i = 0; i < MONSTER_COUNT; i++) {
      monsters.push({
        angle: (i / MONSTER_COUNT) * TAU + 0.6,   // 均匀分布，错开起点
        speed: MONSTER_SPEED,
        wobble: Math.random() * TAU
      });
    }
    updateProgressUI();
  }

  function normAngle(a) {
    a = a % TAU;
    if (a < 0) a += TAU;
    return a;
  }

  // 把 [a1,a2]（a1<a2，长度<2π）并入涂色区间，并重新合并
  function paintArc(a1, a2) {
    var i, seg;
    var na1 = normAngle(a1), na2 = normAngle(a2);
    if (a2 - a1 >= TAU) { painted = [[0, TAU]]; paintedTotal = TAU; return; }
    if (na1 < na2) {
      painted.push([na1, na2]);
    } else {
      painted.push([na1, TAU]); painted.push([0, na2]);
    }
    // 合并
    painted.sort(function (x, y) { return x[0] - y[0]; });
    var merged = [];
    for (i = 0; i < painted.length; i++) {
      seg = painted[i];
      if (merged.length && seg[0] <= merged[merged.length - 1][1] + 1e-6) {
        merged[merged.length - 1][1] = Math.max(merged[merged.length - 1][1], seg[1]);
      } else {
        merged.push([seg[0], seg[1]]);
      }
    }
    painted = merged;
    var total = 0;
    for (i = 0; i < painted.length; i++) total += painted[i][1] - painted[i][0];
    paintedTotal = Math.min(total, TAU);
  }

  function updateProgressUI() {
    var pct = Math.floor(paintedTotal / TAU * 100);
    progressEl.textContent = pct + '%';
    if (pct > best) { best = pct; bestEl.textContent = best + '%'; }
  }

  // ---------- 更新 ----------
  function update(dt) {
    // 开场下落阶段：痞老板从屏幕中心竖直落下，怪物静止
    if (state === 'dropping') {
      dropTimer -= dt;
      if (dropTimer <= 0) {
        state = 'playing';
        dropTimer = 0;
      }
      return;
    }

    if (state !== 'playing') return;

    playTime += dt;
    timeEl.textContent = fmtTime(playTime);

    var prevAngle = planktonAngle;
    planktonAngle += RUN_SPEED * dt;   // RUN_SPEED 为负，顺时针跑

    var airborne = jumpTimer > 0;
    if (airborne) jumpTimer -= dt;

    // 落地状态才涂色（paintArc 内部把角度归一化到 [0, TAU)）
    if (!airborne) paintArc(planktonAngle, prevAngle);
    updateProgressUI();

    // 怪物移动
    for (var i = 0; i < monsters.length; i++) {
      monsters[i].angle = normAngle(monsters[i].angle + monsters[i].speed * dt);
      monsters[i].wobble += dt * 6;
    }

    // 碰撞（滞空时无敌，直接对比渲染用的屏幕坐标）
    if (!airborne) {
      var pp = polar(planktonAngle, R);
      for (i = 0; i < monsters.length; i++) {
        var mp = polar(monsters[i].angle, R);
        var dx = pp[0] - mp[0], dy = pp[1] - mp[1];
        if (dx * dx + dy * dy < HIT_DIST * HIT_DIST) {
          state = 'dead';
          deathFlash = 1;
          setTimeout(showDead, 600);
          break;
        }
      }
    }

    // 胜利判定
    if (paintedTotal >= TAU - 1e-4) {
      state = 'won';
      setTimeout(showWon, 400);
    }
  }

  function jump() {
    if (state === 'playing' && jumpTimer <= 0) {
      jumpTimer = JUMP_TIME;
    }
  }

  // ---------- 绘制 ----------
  function draw() {
    ctx.clearRect(0, 0, W, H);

    // 背景
    var bg = ctx.createRadialGradient(CX, CY, R * 0.2, CX, CY, R * 2.4);
    bg.addColorStop(0, '#24304f');
    bg.addColorStop(1, '#10131f');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    // 圆环跑道
    ctx.beginPath();
    ctx.arc(CX, CY, R, 0, TAU);
    ctx.lineWidth = RING_WIDTH;
    ctx.strokeStyle = 'rgba(255,255,255,0.14)';
    ctx.stroke();

    // 涂色部分
    ctx.lineWidth = PAINT_WIDTH;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#9dff6e';
    ctx.shadowColor = '#67e84f';
    ctx.shadowBlur = 12;
    for (var i = 0; i < painted.length; i++) {
      var s = painted[i];
      ctx.beginPath();
      ctx.arc(CX, CY, R, s[0], s[1]);
      ctx.stroke();
    }
    ctx.shadowBlur = 0;

    // 怪物
    for (i = 0; i < monsters.length; i++) {
      drawMonster(monsters[i]);
    }

    // 痞老板
    drawPlankton();

    // 死亡红闪
    if (deathFlash > 0) {
      deathFlash = Math.max(0, deathFlash - 0.03);
      ctx.fillStyle = 'rgba(255,40,40,' + (deathFlash * 0.35) + ')';
      ctx.fillRect(0, 0, W, H);
    }
  }

  function polar(angle, radius) {
    return [CX + Math.cos(angle) * radius, CY + Math.sin(angle) * radius];
  }

  function drawMonster(m) {
    var p = polar(m.angle, R);
    var x = p[0], y = p[1];
    var r = RING_WIDTH * 1.15;
    var spikes = 8;

    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(m.wobble * 0.3);

    // 刺
    ctx.beginPath();
    for (var i = 0; i < spikes; i++) {
      var a = (i / spikes) * TAU;
      var a2 = a + TAU / spikes / 2;
      ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
      ctx.lineTo(Math.cos(a2) * r * 1.45, Math.sin(a2) * r * 1.45);
    }
    ctx.closePath();
    ctx.fillStyle = '#c0392b';
    ctx.fill();

    // 身体
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, TAU);
    ctx.fillStyle = '#e74c3c';
    ctx.fill();

    // 眼睛
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.5, 0, TAU);
    ctx.fillStyle = '#fff';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(r * 0.12, 0, r * 0.22, 0, TAU);
    ctx.fillStyle = '#111';
    ctx.fill();

    ctx.restore();
  }

  function drawPlankton() {
    // 开场下落：从屏幕中心竖直落到正下方的跑道
    var dropT = state === 'dropping' ? dropTimer / DROP_TIME : 0; // 1→0
    var px = CX, py = CY;
    if (state === 'dropping') {
      py = dropFromY + (CY + R - dropFromY) * (1 - dropT);
    }
    var airborne = jumpTimer > 0;
    var t = airborne ? (JUMP_TIME - jumpTimer) / JUMP_TIME : 0; // 0..1
    var hop = airborne ? Math.sin(t * Math.PI) : 0;
    var radius = R - hop * R * 0.28;   // 跳跃时向圆心方向跳起
    var p = state === 'dropping' ? [px, py] : polar(planktonAngle, radius);
    var x = p[0], y = p[1];
    var scale = (1 + hop * 0.5) * (state === 'dropping' ? (1 + dropT * 0.8) : 1);

    // 落点影子（在跑道上）
    var sp = polar(planktonAngle, R);
    ctx.beginPath();
    ctx.ellipse(sp[0], sp[1], 8 * (1 - hop * 0.5), 4 * (1 - hop * 0.5), planktonAngle + Math.PI / 2, 0, TAU);
    ctx.fillStyle = 'rgba(0,0,0,' + (0.3 * (1 - hop * 0.7)) + ')';
    ctx.fill();

    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);
    ctx.rotate(planktonAngle + Math.PI / 2);

    // 身体（痞老板：绿色细长水滴形）
    ctx.beginPath();
    ctx.ellipse(0, 0, 7, 12, 0, 0, TAU);
    ctx.fillStyle = '#57c256';
    ctx.fill();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = '#2c7a2c';
    ctx.stroke();

    // 大眼睛（痞老板只有一只眼睛）
    ctx.beginPath();
    ctx.arc(0, -3, 5.5, 0, TAU);
    ctx.fillStyle = '#fdf6d8';
    ctx.fill();
    ctx.strokeStyle = '#2c7a2c';
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(0, -3, 2.2, 0, TAU);
    ctx.fillStyle = '#111';
    ctx.fill();

    // 两根触角
    ctx.beginPath();
    ctx.moveTo(-3, -11); ctx.quadraticCurveTo(-6, -18, -9, -20);
    ctx.moveTo(3, -11);  ctx.quadraticCurveTo(6, -18, 9, -20);
    ctx.lineWidth = 1.6;
    ctx.strokeStyle = '#2c7a2c';
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(-9, -20, 2, 0, TAU); ctx.arc(9, -20, 2, 0, TAU);
    ctx.fillStyle = '#ffd94d';
    ctx.fill();

    // 四肢（跑动摆动）
    var legSwing = Math.sin(performance.now() / 90) * 4;
    ctx.beginPath();
    ctx.moveTo(-5, 4); ctx.lineTo(-9, 10 + legSwing);
    ctx.moveTo(5, 4);  ctx.lineTo(9, 10 - legSwing);
    ctx.moveTo(-4, 10); ctx.lineTo(-6, 17 - legSwing);
    ctx.moveTo(4, 10);  ctx.lineTo(6, 17 + legSwing);
    ctx.lineWidth = 1.8;
    ctx.stroke();

    ctx.restore();
  }

  function fmtTime(sec) {
    var m = Math.floor(sec / 60);
    var s = Math.floor(sec % 60);
    return (m > 0 ? m + '分' : '') + s + '秒';
  }

  function resultConfigHtml() {
    return '<br><span style="color:#9aa4c0;font-size:13px">本次配置：怪物 ' + MONSTER_COUNT +
      ' 只 · 怪速 ' + MONSTER_SPEED.toFixed(2) + ' · 痞老板速 ' +
      (-RUN_SPEED).toFixed(2) + '</span>';
  }

  // ---------- 流程 ----------
  function showDead() {
    titleEl.textContent = '被怪物抓住了！';
    titleEl.style.color = '#ff6b6b';
    descEl.innerHTML = '本次涂色进度：<b>' + Math.floor(paintedTotal / TAU * 100) + '%</b>' +
      ' · 存活 <b>' + fmtTime(playTime) + '</b>' + resultConfigHtml() +
      '<br>再接再厉，把整圈涂满！';
    startBtn.textContent = '再来一次';
    overlay.classList.remove('hidden');
  }

  function showWon() {
    titleEl.textContent = '🎉 涂满整圈，胜利！';
    titleEl.style.color = '#9dff6e';
    descEl.innerHTML = '你成功躲开了所有怪物，把整条圆环都涂满了颜色！<br>' +
      '用时 <b>' + fmtTime(playTime) + '</b>' + resultConfigHtml();
    startBtn.textContent = '再玩一次';
    overlay.classList.remove('hidden');
  }

  function startGame() {
    init();
    state = 'dropping';   // 先从圆心落下，落地后怪才开始动
    overlay.classList.add('hidden');
    titleEl.style.color = '#9dff6e';
  }

  startBtn.addEventListener('click', startGame);
  canvas.addEventListener('pointerdown', function () {
    if (state === 'playing') jump();
  });
  window.addEventListener('keydown', function (e) {
    if (e.code === 'Space') {
      e.preventDefault();
      if (state === 'playing') {
        jump();
      } else if (state === 'ready' || state === 'dead' || state === 'won') {
        startGame();
      }
      // dropping 状态下按空格没有任何反应
    }
  });

  // ---------- 主循环 ----------
  function loop(now) {
    if (!lastTime) lastTime = now;
    var dt = Math.min((now - lastTime) / 1000, 0.05);
    lastTime = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  init();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
